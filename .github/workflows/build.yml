# Tests Glitcher on Windows, macOS and Linux, builds the portable apps, and publishes them as a
# GitHub release when you push a version tag:
#
#   every push / pull request -> tests + builds, zips kept 14 days under the run's "Artifacts"
#   git tag v1.3.0 && git push origin v1.3.0 -> the same, then a release "Glitcher 1.3.0"
#                                               with the zips, checksums and the CHANGELOG entry
#
# The tag must equal "v" + __version__ in glitch.py, and CHANGELOG.md needs an entry for it;
# the "version" job checks that first, so a wrong tag fails in seconds rather than after the builds.

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read            # the release job alone gets write access

concurrency:                # a newer push to the same branch cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.12"
  POSE_MODEL: pose_landmarker_heavy.task
  POSE_MODEL_URL: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"           # Windows: read/write the CHANGELOG and logs as UTF-8

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: v
        # read as text: this job installs no packages, and importing glitch.py needs NumPy
        run: |
          v="$(python ci/release_notes.py --print-version)"
          echo "Glitcher $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python ci/release_notes.py --check-tag "$GITHUB_REF_NAME"

  build:
    needs: version
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false      # one platform failing still lets the others finish
      matrix:
        include:
          - name: windows-x64
            os: windows-2025
            pose: true
            exe: dist/Glitcher/Glitcher.exe
          - name: macos-arm64
            os: macos-15
            pose: true
            exe: dist/Glitcher.app/Contents/MacOS/Glitcher
          - name: macos-x64-nopose          # Intel Macs: MediaPipe has no wheel for them
            os: macos-15-intel
            pose: false
            exe: dist/Glitcher.app/Contents/MacOS/Glitcher
          - name: linux-x64
            os: ubuntu-24.04
            pose: true
            exe: dist/Glitcher/Glitcher
    env:
      # optional parts must be present in CI: a missing one fails the tests instead of skipping
      GLITCHER_REQUIRE_GUI: "1"
      GLITCHER_REQUIRE_EXR: "1"
      GLITCHER_REQUIRE_MINIAUDIO: "1"
      GLITCHER_REQUIRE_POSE: ${{ matrix.pose && '1' || '0' }}
      GLITCHER_REQUIRE_NUMBA: ${{ matrix.name != 'macos-x64-nopose' && '1' || '0' }}   # no Intel Mac wheels
      GLITCHER_REQUIRE_NATIVE: "1"     # the app renders with the native engine, built below
    defaults:
      run:
        shell: bash         # the same scripts on all three systems (Git Bash on Windows)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Linux system packages (virtual display for the GUI; OpenGL / GLES libraries MediaPipe loads)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libegl1 libgles2

      - name: Python packages
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          python -m pip list

      # the native engine first: the app's tests render with it and the portable build bundles it
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-app-${{ matrix.name }}-${{ hashFiles('engine/Cargo.lock') }}
      - name: Build the native engine
        working-directory: engine
        run: cargo build --release --lib

      - name: Pose model (cached between runs)
        if: matrix.pose
        id: model
        uses: actions/cache@v5
        with:
          path: ${{ env.POSE_MODEL }}
          key: pose-model-heavy-float16-v1

      - name: Download the pose model
        if: matrix.pose && steps.model.outputs.cache-hit != 'true'
        run: curl -fL --retry 5 --retry-all-errors -o "$POSE_MODEL" "$POSE_MODEL_URL"

      - name: Pose estimation works
        if: matrix.pose
        run: python estimate_pose.py --check --model "$POSE_MODEL"

      - name: Tests
        env:
          GLITCHER_POSE_MODEL: ${{ matrix.pose && format('{0}/{1}', github.workspace, env.POSE_MODEL) || '' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x900x24" python -m pytest -v -ra --durations=10 tests
          else
            python -m pytest -v -ra --durations=10 tests
          fi

      - name: Build the portable app
        run: python build_portable.py ${{ !matrix.pose && '--no-pose' || '' }}

      - name: Check the built app
        env:
          EXE: ${{ matrix.exe }}
          POSE_FLAG: ${{ matrix.pose && '--pose' || '' }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x900x24" python tests/smoke_frozen.py "$EXE" ${POSE_FLAG:+"$POSE_FLAG"}
          else
            python tests/smoke_frozen.py "$EXE" ${POSE_FLAG:+"$POSE_FLAG"}
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Glitcher-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0      # already a zip
          retention-days: 14

  engine:
    # the native engine (engine/, Rust) and the Fusion node: tests on every OS, then the library
    # and the .fuse files as an artifact ("glitcher-fusion-<os>") to drop into Fusion's Fuses folder
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, name: windows-x64, lib: glitch_core.dll }
          - { os: macos-15, name: macos-arm64, lib: libglitch_core.dylib }
          - { os: ubuntu-24.04, name: linux-x64, lib: libglitch_core.so }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - uses: actions/checkout@v6
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: cargo-${{ matrix.name }}-${{ hashFiles('engine/Cargo.lock') }}
      - name: Tests
        run: cargo test --release
      - name: Build the library
        run: cargo build --release --lib
      - name: The Fusion node against a stand-in of Fusion's API (LuaJIT)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q luajit
          luajit ../fusion/test_glitcher_mock.lua ../fusion/Glitcher.fuse "$PWD/target/release/${{ matrix.lib }}"
          luajit ../fusion/test_probe_mock.lua ../fusion/GlitcherProbe.fuse "$PWD/target/release/${{ matrix.lib }}"
      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          d="../dist-fusion/Glitcher-Fusion-$VERSION-${{ matrix.name }}"
          mkdir -p "$d"
          cp "target/release/${{ matrix.lib }}" ../fusion/Glitcher.fuse ../fusion/GlitcherProbe.fuse ../fusion/NOTES.md ../fusion/README.md "$d/"
          py="$(command -v python || command -v python3)"     # Windows: "python" (python3 there can be a Store stub)
          cd ../dist-fusion && "$py" -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', '.', sys.argv[1])" "Glitcher-Fusion-$VERSION-${{ matrix.name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: Glitcher-Fusion-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: dist-fusion/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write       # create the release and upload its files
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: Glitcher-*
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd dist && sha256sum -- *.zip | tee SHA256SUMS.txt && cd ..
          python3 ci/release_notes.py > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Glitcher $VERSION" --notes-file notes.md
